services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scholargraph-postgres
    environment:
      POSTGRES_USER: scholargraph
      POSTGRES_PASSWORD: scholargraph
      POSTGRES_DB: scholargraph
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholargraph -d scholargraph"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scholargraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: scholargraph-grobid
    ports:
      - "8070:8070"

  ollama:
    image: ollama/ollama:latest
    container_name: scholargraph-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  redis-data:
  ollama-data:
