services:
  grobid:
    image: lfoppiano/grobid:0.7.3
    container_name: scholargraph-grobid
    ports:
      - "8070:8070"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: scholargraph-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
