services:
  - type: web
    name: scholargraph-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: npm run start -w @scholargraph/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: AI_PROVIDER
        value: heuristic
      - key: DATABASE_URL
        fromDatabase:
          name: scholargraph-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: scholargraph-redis
          property: connectionString

  - type: worker
    name: scholargraph-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: npm run worker -w @scholargraph/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: heuristic
      - key: DATABASE_URL
        fromDatabase:
          name: scholargraph-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: scholargraph-redis
          property: connectionString

  - type: web
    name: scholargraph-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerCommand: npm run start -w @scholargraph/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: pserv
    name: scholargraph-grobid
    runtime: image
    image:
      url: docker.io/lfoppiano/grobid:0.8.0

databases:
  - name: scholargraph-db
    databaseName: scholargraph
    user: scholargraph

keyValue:
  - name: scholargraph-redis
    ipAllowList: []
